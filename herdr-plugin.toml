# herdr plugin manifest. Install with `herdr plugin install peinan/rp`; for a local
# checkout use `herdr plugin link /path/to/rp`. See "Herdr plugin" in README.md.
#
# This file is unrelated to the zsh plugin (rp.plugin.zsh, functions/): zsh plugin
# managers ignore it, and herdr ignores them.

id = "rp"
name = "rp"
version = "0.3.1"
# Verified against 0.9.0: popup panes with width/height and `herdr plugin pane open`.
min_herdr_version = "0.9.0"
description = "Jump between ghq-managed repositories with fzf"
# functions/rp is zsh, which the Windows beta does not have.
platforms = ["linux", "macos"]

# One action, because hub mode reaches every operation from inside the picker.
# With the default keys: enter opens a workspace, ^T a tab, ^O the full action
# list, ^R creates, ^X deletes, ^G switches to your GitHub repositories; RP_KEY_*
# rebinds any of them. Adding an operation to rp no longer costs an action here,
# a pane, or a key binding. Bind it with:
#
#   [[keys.command]]
#   key = "prefix+ctrl+r"
#   type = "plugin_action"
#   command = "rp.hub"
#
# Actions run without a TTY, so this one only asks herdr to open the pane of the
# same name (herdr/action.zsh).

[[actions]]
id = "hub"
title = "rp: repositories"
contexts = ["global", "workspace"]
command = ["zsh", "herdr/action.zsh", "hub"]

# Panes are real terminals. This one runs hub mode through herdr/pane.zsh, which
# autoloads functions/rp from this checkout, and the popup closes when rp exits.
# `command` is argv (no shell), hence the explicit `zsh -c`; the script is
# addressed through $HERDR_PLUGIN_ROOT so a --cwd override on
# `herdr plugin pane open` cannot break it.

[[panes]]
id = "hub"
title = "rp"
placement = "popup"
width = "80%"
height = "60%"
command = ["zsh", "-c", 'exec "$HERDR_PLUGIN_ROOT/herdr/pane.zsh"']
